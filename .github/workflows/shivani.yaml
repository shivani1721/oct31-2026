name: myworkflow1
on:
  push:
jobs:
  myjob1:
    runs-on: ubuntu-latest
    steps:
      - name: mystep1
        run: |
          whoami
          pwd
          cat /etc/os-release
          ls -al
      - name: mystep2-clone the repo in current work directory
        uses: actions/checkout@v4
      - name: mystep3-check the source code
        run: ls -al
      - name: mystep4-we are going to build our own docker image 
        run: sudo docker image build -t shivanipanwar/shivaniimage_oct_31:t2 -f Dockerfile .
      - name: login to docker hub 
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: mystep5-push the docker image 
        run: sudo docker image push shivanipanwar/shivaniimage_oct_31:t2   
